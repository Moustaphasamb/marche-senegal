<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="robots" content="noindex"/>
<title>Page introuvable — Marché Sénégal</title>
<link rel="icon" href="/assets/logo-msn-2026.png"/>
<style>
  :root { --green:#1C6845; --gold:#D8A72B; --fond:#FBF8F1; --texte:#1E2B24; --doux:#5E6B63; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--fond); color:var(--texte); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; padding:24px 16px; }
  main { max-width:440px; text-align:center; }
  img { width:72px; height:72px; border-radius:16px; }
  h1 { font-size:1.6rem; margin:20px 0 8px; color:var(--green); }
  p { margin:0 0 24px; color:var(--doux); line-height:1.5; }
  .actions { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
  a { display:inline-block; padding:12px 20px; border-radius:12px; font-weight:600; text-decoration:none; }
  .principal { background:var(--green); color:#fff; }
  .secondaire { background:#fff; color:var(--green); border:1px solid #C4D5C5; }
  a:focus-visible { outline:3px solid var(--gold); outline-offset:2px; }
</style>
</head>
<body>
<main>
  <img src="/assets/logo-msn-2026.png" alt="Marché Sénégal" width="72" height="72"/>
  <h1>Cette page est introuvable</h1>
  <p>Le lien est peut-être incomplet, ou la page a été retirée. Les marchés et les boutiques vous attendent sur l'accueil.</p>
  <div class="actions">
    <a class="principal" href="/">Retour à l'accueil</a>
    <a class="secondaire" href="/recherche">Rechercher un produit</a>
  </div>
</main>
</body>
</html>
