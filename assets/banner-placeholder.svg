<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Visuel temporaire — bannière Marché Sénégal">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#143325"/>
      <stop offset="100%" stop-color="#0D1F17"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E6A817" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#E6A817" stop-opacity="0"/>
    </linearGradient>
    <!-- Motif inspiré des tissus wax -->
    <pattern id="wax" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="none"/>
      <circle cx="40" cy="40" r="14" fill="none" stroke="#E6A817" stroke-opacity=".16" stroke-width="2"/>
      <circle cx="40" cy="40" r="26" fill="none" stroke="#1B6B3A" stroke-opacity=".28" stroke-width="2"/>
      <path d="M0 40 H14 M66 40 H80 M40 0 V14 M40 66 V80" stroke="#E6A817" stroke-opacity=".14" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#wax)"/>
  <circle cx="1330" cy="150" r="380" fill="url(#glow)"/>

  <!-- Auvents des étals -->
  <g opacity=".92">
    <path d="M60 470 L260 372 L460 470 Z" fill="#1B6B3A" fill-opacity=".55"/>
    <path d="M300 500 L500 396 L700 500 Z" fill="#E6A817" fill-opacity=".38"/>
    <path d="M560 470 L760 372 L960 470 Z" fill="#1B6B3A" fill-opacity=".45"/>
    <path d="M820 505 L1020 400 L1220 505 Z" fill="#E6A817" fill-opacity=".30"/>
    <path d="M1080 470 L1280 372 L1480 470 Z" fill="#1B6B3A" fill-opacity=".40"/>
  </g>

  <!-- Étals -->
  <g>
    <rect x="90" y="470" width="340" height="240" rx="6" fill="#0D1F17" fill-opacity=".55"/>
    <rect x="350" y="500" width="300" height="210" rx="6" fill="#0D1F17" fill-opacity=".45"/>
    <rect x="600" y="470" width="330" height="240" rx="6" fill="#0D1F17" fill-opacity=".55"/>
    <rect x="860" y="505" width="310" height="205" rx="6" fill="#0D1F17" fill-opacity=".45"/>
    <rect x="1120" y="470" width="340" height="240" rx="6" fill="#0D1F17" fill-opacity=".55"/>
  </g>

  <!-- Rouleaux de tissu empilés -->
  <g opacity=".8">
    <rect x="130" y="560" width="260" height="16" rx="8" fill="#E6A817" fill-opacity=".55"/>
    <rect x="130" y="588" width="260" height="16" rx="8" fill="#1B6B3A" fill-opacity=".75"/>
    <rect x="130" y="616" width="260" height="16" rx="8" fill="#E6A817" fill-opacity=".35"/>
    <rect x="640" y="560" width="250" height="16" rx="8" fill="#1B6B3A" fill-opacity=".7"/>
    <rect x="640" y="588" width="250" height="16" rx="8" fill="#E6A817" fill-opacity=".5"/>
    <rect x="1160" y="560" width="260" height="16" rx="8" fill="#E6A817" fill-opacity=".45"/>
    <rect x="1160" y="588" width="260" height="16" rx="8" fill="#1B6B3A" fill-opacity=".7"/>
  </g>

  <!-- Sol -->
  <rect x="0" y="710" width="1600" height="190" fill="#0A1811"/>
  <rect x="0" y="710" width="1600" height="3" fill="#E6A817" fill-opacity=".25"/>

  <!-- Marqueur explicite : ce visuel ne doit jamais partir en production -->
  <g opacity=".5">
    <rect x="600" y="790" width="400" height="42" rx="21" fill="none" stroke="#E6A817" stroke-opacity=".55" stroke-width="2"/>
    <text x="800" y="818" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
          font-size="19" font-weight="700" letter-spacing="3" fill="#E6A817">VISUEL TEMPORAIRE</text>
  </g>
</svg>
