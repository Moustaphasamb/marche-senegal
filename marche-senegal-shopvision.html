<head>
  <meta charset="UTF-8">

  <meta name="description" content="Préparez la vitrine de votre boutique Marché Sénégal : photos, produits, rayons, puis publication.">

  <script src="icons.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300..800&family=Newsreader:ital,opsz,wght@0,6..72,300..800;1,6..72,400..600&display=swap" rel="stylesheet">

</head>
<body class="ve-page espace-vendeur ms-design page-shopvision">
  <header class="ve-topbar">
    <button type="button" class="ve-icon ve-menu" id="menuButton" aria-label="Ouvrir le menu"><span class="ms-menu-lines" aria-hidden="true"></span></button>
    <a href="marche-senegal-ma-boutique.html">Ma boutique</a><span aria-hidden="true">/</span><span>Ma vitrine</span>
    <a class="ve-link ve-public" id="publicShopLink" href="marche-senegal-accueil.html" hidden>Voir ma boutique ↗</a>
  </header>
  <main class="ve-main">
    <section class="ve-access" id="ve-access" hidden>
      <h1 id="ve-access-title"></h1>
      <p id="ve-access-text"></p>
      <a class="ve-btn ve-primary" id="ve-access-link" hidden></a>
      <button type="button" class="ve-btn" id="ve-retry" hidden>Réessayer</button>
    </section>
<section class="ve" id="ve" hidden aria-label="Éditeur de vitrine">
  <h1>Ma vitrine</h1>
  <ol class="ve-steps" id="ve-steps">
    <li><button type="button" data-etape="1">1 · Photos</button></li>
    <li><button type="button" data-etape="2">2 · Produits</button></li>
    <li><button type="button" data-etape="3">3 · Rayons</button></li>
    <li><button type="button" data-etape="4">4 · Publier</button></li>
  </ol>
  <p class="ve-status" id="ve-status" role="status" aria-live="polite"></p>
  <div class="ve-corps">
    <div class="ve-panel" id="ve-panel"></div>
    <!-- Aperçu client (étapes 3 et 4) : la vraie page boutique, hors du panneau pour
         ne pas se recharger à chaque affichage. Sur téléphone, ouvert à la demande. -->
    <aside class="ve-apercu" id="ve-apercu" hidden aria-label="Ce que voit le client">
      <div class="ve-apercu-tete">
        <b>Ce que voit le client</b>
        <a id="ve-apercu-onglet" target="_blank" rel="noopener">Ouvrir dans un onglet ↗</a>
        <button type="button" class="ve-btn ve-apercu-fermer" id="ve-apercu-fermer">← Revenir</button>
      </div>
      <div class="ve-apercu-ecran" id="ve-apercu-ecran"></div>
    </aside>
  </div>
  <input id="ve-file" type="file" accept="image/jpeg,image/png,image/webp" hidden>
  <input id="ve-camera" type="file" accept="image/jpeg,image/png,image/webp" capture="environment" hidden>
  <input id="ve-photo-produit" type="file" accept="image/jpeg,image/png,image/webp" capture="environment" hidden>
  <!-- Sans « capture » : le téléphone propose de filmer ou de choisir une vidéo déjà prise. -->
  <input id="ve-video-boutique" type="file" accept="video/*" hidden>
</section>
<!-- /ve -->
  </main>
  <script src="api.js"></script>
  <script>
  // Vitrine en pause (api.js) : hors atelier, retour à Ma boutique.
  if (!vitrineVisible()) { location.replace('marche-senegal-ma-boutique.html'); }
  </script>
  <script src="marche-senegal-menu-vendeur.js"></script>
  <script src="vitrine-editeur.js"></script>
  <script src="vue-360.js"></script>
  <script src="vitrine-editeur-ui.js"></script>
  <script>
  // Accès vendeur, puis l'assistant (vitrine-editeur-ui.js). Chaque action est
  // enregistrée en brouillon sur le serveur ; rien n'est public avant « Publier ».
  (async function () {
    if (!vitrineVisible()) return; // en pause : la page part vers Ma boutique
    const $ = id => document.getElementById(id);
    $('menuButton').onclick = toggleSidebar;

    function acces(titre, texte, lien, libelle) {
      $('ve').hidden = true;
      $('ve-access').hidden = false;
      $('ve-access-title').textContent = titre;
      $('ve-access-text').textContent = texte;
      const a = $('ve-access-link');
      a.hidden = !lien;
      if (lien) { a.href = lien; a.textContent = libelle; }
    }

    async function envoyerPhotoVitrine(fichier) {
      const corps = new FormData();
      // Une photo 360° garde 4 096 px de large sur le serveur : à 2 400, elle serait floue une fois déroulée.
      try {
        const image = await createImageBitmap(fichier);
        if (Vue360.estPanorama(image.width, image.height)) corps.append('vue', '360');
        image.close();
      } catch { /* image illisible ici : le serveur tranchera */ }
      corps.append('image', fichier);
      try {
        const reponse = await fetch(API_URL + '/api/upload/showcase', {
          method: 'POST', headers: { Authorization: 'Bearer ' + localStorage.getItem('token') }, body: corps
        });
        const d = await reponse.json();
        if (reponse.ok && d.success && typeof d.url === 'string') return { success: true, url: d.url };
        return { success: false, message: d.message || 'L’envoi de la photo a échoué.' };
      } catch {
        return { success: false, message: 'Erreur de connexion au serveur' };
      }
    }

    // ── Vidéo de ma boutique : envoi direct à Cloudinary, par morceaux ──
    // Une vidéo pèse 30 à 60 Mo. Elle part en morceaux de 6 Mo portant le même
    // identifiant ; Cloudinary les recolle. En 4G, une coupure ne fait renvoyer que le
    // morceau en cours, dès que le réseau revient. Le serveur ne fait que signer l'envoi.
    const MORCEAU_VIDEO = 6 * 1024 * 1024;
    const attendreReseau = ms => new Promise(ok => {
      const fin = () => { clearTimeout(minuterie); window.removeEventListener('online', fin); ok(); };
      const minuterie = setTimeout(fin, ms);
      window.addEventListener('online', fin);
    });
    // Rejoue une étape tant que le réseau coupe (~3 min au plus) ; un refus ne se rejoue pas.
    async function avecReprise(etape, suivi, texteCoupure) {
      for (let essai = 1; ; essai++) {
        try { return await etape(); } catch (erreur) {
          if ((erreur && erreur.refus) || essai >= 9) throw erreur;
          if (suivi) suivi(texteCoupure);
          await attendreReseau(Math.min(2000 * 2 ** (essai - 1), 30000));
        }
      }
    }

    async function envoyerVideoBoutique(fichier, suivi) {
      try {
        const autorisation = await avecReprise(async () => {
          const r = await apiCall('/api/shops/me/video/autorisation', { method: 'POST' });
          if (r && r.success) return r.data;
          if (r && r.message && r.message !== 'Erreur de connexion au serveur') throw { refus: true, message: r.message };
          throw new Error('réseau');
        }, suivi, 'Réseau coupé : l’envoi de la vidéo commencera dès que la connexion revient…');

        const adresse = `https://api.cloudinary.com/v1_1/${autorisation.cloudName}/video/upload`;
        const identifiant = (crypto.randomUUID && crypto.randomUUID()) || String(Date.now()) + Math.random().toString(16).slice(2);
        let resultat = null;
        for (let debut = 0; debut < fichier.size; debut += MORCEAU_VIDEO) {
          const fin = Math.min(debut + MORCEAU_VIDEO, fichier.size);
          const pourcent = Math.round((debut / fichier.size) * 100);
          if (suivi) suivi(`Envoi de la vidéo : ${pourcent} %`);
          resultat = await avecReprise(async () => {
            const corps = new FormData();
            corps.append('file', fichier.slice(debut, fin), fichier.name || 'boutique.mp4');
            corps.append('api_key', autorisation.apiKey);
            corps.append('timestamp', autorisation.timestamp);
            corps.append('folder', autorisation.folder);
            corps.append('signature', autorisation.signature);
            const reponse = await fetch(adresse, {
              method: 'POST',
              headers: { 'X-Unique-Upload-Id': identifiant, 'Content-Range': `bytes ${debut}-${fin - 1}/${fichier.size}` },
              body: corps
            });
            let d = null;
            try { d = await reponse.json(); } catch { /* réponse coupée en route */ }
            if (reponse.ok) return d || {};
            if (reponse.status >= 400 && reponse.status < 500 && reponse.status !== 408 && reponse.status !== 429) {
              console.error('Cloudinary a refusé la vidéo :', d && d.error && d.error.message);
              throw { refus: true, message: 'Cette vidéo n’a pas pu être envoyée. Filmez en mode vidéo normal, 15 à 30 secondes, puis réessayez.' };
            }
            throw new Error('serveur ' + reponse.status);
          }, suivi, `Réseau coupé à ${pourcent} % : l’envoi reprendra là où il s’est arrêté dès que la connexion revient…`);
        }
        if (!resultat || typeof resultat.secure_url !== 'string') {
          return { success: false, message: 'L’envoi de la vidéo n’a pas abouti. Réessayez.' };
        }
        if (suivi) suivi('Envoi de la vidéo : 100 %');
        return { success: true, url: resultat.secure_url };
      } catch (erreur) {
        return {
          success: false,
          message: erreur && erreur.refus ? erreur.message
            : 'La connexion est coupée depuis trop longtemps. Réessayez quand le réseau revient.'
        };
      }
    }

    // Partie 2b : la zone entourée, découpée dans la photo (768 px au plus) pour l'IA.
    async function decouperPhoto(adresse, zone) {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      await new Promise((ok, ko) => { img.onload = ok; img.onerror = () => ko(new Error('Photo inaccessible')); img.src = Vue360.urlTaille(adresse, 2400); });
      const W = img.naturalWidth, H = img.naturalHeight;
      const sw = zone.w * W, sh = zone.h * H;
      const k = Math.min(1, 768 / Math.max(sw, sh));
      const toile = document.createElement('canvas');
      toile.width = Math.max(1, Math.round(sw * k));
      toile.height = Math.max(1, Math.round(sh * k));
      toile.getContext('2d').drawImage(img, (zone.x - zone.w / 2) * W, (zone.y - zone.h / 2) * H, sw, sh, 0, 0, toile.width, toile.height);
      return toile.toDataURL('image/jpeg', 0.85);
    }

    // Photo de l'article prise de près : 1 024 px au plus.
    async function fichierEnImage(fichier) {
      const image = await createImageBitmap(fichier);
      const k = Math.min(1, 1024 / Math.max(image.width, image.height));
      const toile = document.createElement('canvas');
      toile.width = Math.round(image.width * k);
      toile.height = Math.round(image.height * k);
      toile.getContext('2d').drawImage(image, 0, 0, toile.width, toile.height);
      image.close();
      return toile.toDataURL('image/jpeg', 0.85);
    }

    // Photo du produit créé par la fiche de l'IA : même envoi que la page « Ajouter un produit ».
    async function envoyerPhotoProduit(image) {
      try {
        const corps = new FormData();
        corps.append('image', await (await fetch(image)).blob(), 'produit.jpg');
        const reponse = await fetch(API_URL + '/api/upload/image', {
          method: 'POST', headers: { Authorization: 'Bearer ' + localStorage.getItem('token') }, body: corps
        });
        const d = await reponse.json();
        if (reponse.ok && d.success && typeof d.url === 'string') return { success: true, url: d.url };
        return { success: false, message: d.message || 'L’envoi de la photo du produit a échoué.' };
      } catch {
        return { success: false, message: 'Erreur de connexion au serveur' };
      }
    }

    try {
      if (!isLoggedIn()) {
        acces('Créez la vitrine de votre boutique', 'Connectez-vous avec votre compte vendeur pour préparer votre vitrine.', 'marche-senegal-connexion-vendeur.html', 'Se connecter comme vendeur');
        return;
      }
      const utilisateur = getCurrentUser();
      if (!utilisateur || String(utilisateur.role).toUpperCase() !== 'SELLER') {
        acces('Un espace réservé aux vendeurs', 'Ouvrez une session vendeur pour gérer la vitrine de votre boutique.', 'marche-senegal-connexion-vendeur.html', 'Accéder à la connexion vendeur');
        return;
      }
      const tableau = await getDashboard();
      if (!tableau.success || !tableau.data || !tableau.data.shop) throw new Error(tableau.message || 'Impossible de charger votre boutique.');
      const boutique = tableau.data.shop;
      remplirIdentiteMenu(boutique);
      const lienBoutique = 'marche-senegal-boutique.html?id=' + encodeURIComponent(boutique.id);
      $('publicShopLink').href = lienBoutique;
      $('publicShopLink').hidden = false;
      $('ve').hidden = false;
      const editeur = VitrineEditeur.monter({
        api: VitrineEditeurCore.creerApi({ apiCall, envoyerFichier: envoyerPhotoVitrine, envoyerVideo: envoyerVideoBoutique, decouperPhoto, envoyerPhotoProduit, fichierEnImage }),
        boutique,
        lienApercu: lienBoutique + '&apercu=brouillon',
        // Adresse propre et partageable (WhatsApp) : /boutiques/:id, servie par api/page.js.
        lienPublic: location.origin + '/boutiques/' + encodeURIComponent(boutique.id),
        confirmer: async message => window.confirm(message)
      });
      await editeur.charger();
    } catch (erreur) {
      acces('Connexion à la boutique indisponible', erreur.message || 'Le serveur ne répond pas. Réessayez.', null);
      $('ve-retry').hidden = false;
      $('ve-retry').onclick = () => location.reload();
    }
  })();
  </script>
</body>
</html>
